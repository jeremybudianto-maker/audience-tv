<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101211"><title>Audience TV — One Message. Different Audiences.</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="shell-head"><a class="wordmark" href="#" id="brand"><span class="bbc-logo" aria-label="BBC"><b>B</b><b>B</b><b>C</b></span></a><span>AUDIENCE TV <b>/</b> A BBC-INSPIRED BROADCAST</span><button id="helpBtn" aria-label="Open remote and keyboard help">REMOTE <span>⌘</span></button></header>
<main id="cabinet"><div id="viewport"><div id="screen" aria-label="Audience Television presentation"><div id="program"></div><div class="scanlines"></div><div class="vignette"></div><div id="transition" aria-hidden="true"><canvas id="noise" width="240" height="135"></canvas></div><div id="osd" aria-live="polite"></div><div id="pauseBadge" hidden>Ⅱ BROADCAST PAUSED</div><div id="lens" role="region" aria-label="Audience lens" hidden></div><div id="boot"><div class="intro-glow"></div><div class="boot-copy"><span class="bbc-logo" aria-label="BBC"><b>B</b><b>B</b><b>C</b></span><h1>iPLAYER</h1></div><button id="start" class="intro-skip">Enter to skip <span>↵</span></button></div></div></div></main>
<footer class="shell-foot"><div class="signal"><i></i><span id="status">READY TO BROADCAST</span></div><nav aria-label="Television controls"><button id="prev" aria-label="Previous channel">←</button><button id="guideBtn">GUIDE <kbd>G</kbd></button><button id="next" aria-label="Next channel">→</button><span class="divider"></span><button id="pauseBtn" aria-label="Pause broadcast">Ⅱ</button><button id="muteBtn" aria-label="Unmute sound">SOUND OFF</button><label class="volume">VOL <input id="volume" aria-label="Sound volume" type="range" min="0" max="100" value="20"></label><button id="fullscreen" aria-label="Toggle fullscreen">⛶</button></nav></footer>
<aside id="remote" hidden aria-label="Remote control"><div class="remote-title"><span class="bbc-logo" aria-label="BBC"><b>B</b><b>B</b><b>C</b></span><button id="closeRemote" aria-label="Close remote">×</button></div><button id="power" class="power">⏻ <span>Power / Restart</span></button><div class="numkeys"></div><div class="remote-row"><button data-action="prev">CH −</button><button data-action="next">CH +</button></div><div class="remote-row"><button data-action="guide">GUIDE</button><button data-action="pause">Ⅱ / ▶</button></div><button data-action="lens">AUDIENCE LENS <kbd>I</kbd></button><button data-action="advance">NEXT BEAT <kbd>Enter</kbd></button><button data-action="finale">FINAL TRANSMISSION</button><dl><dt>← →</dt><dd>Switch channels</dd><dt>1–6</dt><dd>Tune directly</dd><dt>Space</dt><dd>Pause / play</dd><dt>G / Esc</dt><dd>TV guide</dd><dt>M / F</dt><dd>Mute / fullscreen</dd><dt>I</dt><dd>Audience lens</dd></dl></aside>
<div id="announcement" class="sr-only" aria-live="polite"></div><script src="script.js"></script>
</body></html>
